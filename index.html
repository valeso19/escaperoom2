[{q:'El partido empieza a las 15:00. Cedric se levantó 5 horas y 45 minutos antes. ¿A qué hora se levantó? (h:mm)',a:['9:15','09:15','915','0915'],h:'Restá 6 horas y sumá 15.'},
{q:'Completá la secuencia:',v:'3 – 6 – 12 – 24 – 48 – ?',a:['96'],h:'Cada número se duplica.'},
{q:'Ordená el nombre de la lechuza de Harry:',v:'W D G I H E',a:['hedwig'],h:'Es blanca como la nieve.'},
{q:'Cada gol vale 10 puntos y la Snitch dorada 150. Hufflepuff hizo 11 goles y atrapó la Snitch; Gryffindor hizo 18 goles. ¿Por cuántos puntos ganó Hufflepuff?',a:['80'],h:'Hufflepuff: 110 + 150. Gryffindor: 180.'}],
[{q:'Leé la palabra al revés y decime qué es:',v:'N O G A R D',a:['dragon'],h:'Escupe fuego.'},
{q:'¿Qué posición (1-7) cambió en la segunda fila?',v:'🦁🐍🦅🦡🦁🐍🦅<br>🦅🐍🦅🦡🦁🐍🦅',a:['1','uno'],h:'Es la primera.'},
{q:'Soy un tren rojo que sale del andén 9¾. ¿Qué soy?',a:['expresodehogwarts','trendehogwarts','expreso','tren','hogwartsexpress'],h:'Lleva alumnos al colegio.'},
{q:'Girá el celular y leé el hechizo que aturde al oponente:',v:rot('STUPEFY'),a:['stupefy','desmaius'],h:'Un rayo rojo.'}],
[{q:'¿Qué profesora de Herbología es la jefa de Hufflepuff?',o:['Pomona Sprout','Sybill Trelawney','Charity Burbage','Poppy Pomfrey'],a:['Pomona Sprout'],h:'Cuida las mandrágoras.'},
{q:'¿Cómo se llama la gata del celador Filch?',a:['senoranorris','mrsnorris','norris'],h:'Se llama como una señora.'},
{q:'Ordená la criatura que absorbe la felicidad:',v:'N T E R O M E D',a:['dementor','dementores'],h:'Los vigila Azkaban.'},
{q:'Estatuas: 🦁 🐍 🦅 🦡. ¿Qué animal es el emblema de la casa de la valentía?',a:['leon','elleon','gryffindor'],h:'Es el rey de la selva.'}],
[{q:'Una poción mezcla 3 ingredientes en proporción 4 : 1 : 5. Si el total son 20 ml, ¿cuántos ml tiene el ingrediente mayor?',a:['10','10ml'],h:'4 + 1 + 5 = 10 partes.'},
{q:'El andén de Harry es un número menos uno. En binario, ¿cuál es el anterior? 1 0 0 1 en decimal:',v:'1 0 0 1',a:['9','nueve'],h:'8 + 1.'},
{q:'Ordená el hechizo del guardián plateado:',v:'S U N O R T A P',a:['patronus'],h:'Se usa contra dementores.'},
{q:'Cuatro frascos en fila: 🟠 🔵 🟣 🟢. Pistas: 1) El veneno no está en los extremos. 2) El naranja está a la izquierda del veneno. 3) El azul no es veneno. ¿Cuál es el veneno?',o:['🟠','🔵','🟣','🟢'],a:['🟣'],h:'Solo hay dos posiciones posibles.'}],
[{q:'Sumá los dígitos del número de bóveda 687 y multiplicalo por la cantidad de libros de la saga.',a:['147'],h:'6+8+7 = 21; son 7 libros.'},
{q:'Tres números seguidos: edad con la que Harry entra al colegio, cantidad de libros y cantidad de casas.',a:['1174'],h:'11 … 7 … 4.'},
{q:'Ordená lo que se sirve en un cumpleaños:',v:'R T O T A',a:['torta','pastel'],h:'Se sopla una vela.'},
{q:'Hedwig se escondió entre los murciélagos. ¿Cuántos 🦉 hay?',g:[2,7,10,15,19,23],a:['6','seis'],h:'Contá fila por fila.'}]]};
function applyHouse(){const k=S&&S.house&&HC[S.house]?S.house:'gryffindor';CFG.codes=HC[k];R=BASE.map((r,i)=>Object.assign({},r,{ch:r.ch.map((c,j)=>Object.assign({},c,(V[k][i]||[])[j]||{}))}))}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s\-.,!?]/g,'');
let R,S,CFG={codes:CODES,bonus:500,paused:false,hideRank:false},DB=null,players={},view='intro',room=0,isOwner=false,sound=true,msg='';
const sv=()=>{try{localStorage.setItem('g15',JSON.stringify(S))}catch(e){}if(DB&&S&&S.name)DB.collection('players').doc(S.id).set(S).catch(()=>{})};
try{S=JSON.parse(localStorage.getItem('g15'))}catch(e){}
applyHouse();
function snd(f=660,d=.15){if(!sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}
function boom(em=['🎉','✨','🎊','💜','🌟']){const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),900);snd(880,.3);for(let i=0;i<24;i++){const d=document.createElement('div');d.className='fx';d.textContent=em[i%em.length];d.style.left=Math.random()*95+'%';d.style.animationDelay=Math.random()+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
const key=(r,c)=>r+'-'+c;
const rdone=r=>R[r].ch.filter((_,c)=>S.done[key(r,c)]).length;
const allRooms=()=>R.every((_,r)=>rdone(r)==4);
const roomsDone=()=>R.filter((_,r)=>rdone(r)==4).length;
function totals(){const t={};HOUSES.forEach(h=>t[h.k]=0);const L=Object.values(players);if(!DB||!L.find(p=>p.id==S.id))L.push(S);L.forEach(p=>{if(p&&p.house)t[p.house]+=p.pts||0});return t}
const H=k=>HOUSES.find(h=>h.k==k)||HOUSES[0];
function nav(){$('#nav').innerHTML=S&&S.house?`<button onclick="go('map')">🗺️ Mapa</button><button onclick="go('board')">🏆 Ranking</button><button onclick="go('profile')">👤 Yo</button><button onclick="sound=!sound;nav()">${sound?'🔊':'🔇'}</button>`:''}
function go(v,r){view=v;if(r!=null)room=r;msg='';if(v=='room'||v=='final'){const o=document.createElement('div');o.className='ovl';o.innerHTML='<span>'+(v=='room'?R[room].e:'🚪')+'</span><h2>'+(v=='room'?R[room].n:'LA BÓVEDA DE LOS 15')+'</h2>';document.body.appendChild(o);snd(120,.6);setTimeout(()=>o.remove(),1500)}draw()}
function draw(){nav();const a=$('#app');a.classList.remove('fi');void a.offsetWidth;a.classList.add('fi');
if(CFG.paused&&!isOwner&&S&&S.house){a.innerHTML='<h2>JUEGO EN PAUSA</h2><p class="msg">La anfitriona pausó el juego. ¡Esperá un momento!</p>';return}
({intro,setup,map,room:roomV,final,board,profile}[view]||intro)(a)}
function intro(a){if(S&&S.house)return go('map');
a.innerHTML=`<div class="pop"><div class="door"><i></i></div><h1>BIENVENIDOS AL CUMPLE 15 DE GIULIANA</h1><p class="msg mut">Seis salas. Seis secretos. Un misterio final.</p><button class="gold" onclick="go('setup')">ENTRAR AL JUEGO</button></div>`}
function setup(a){a.innerHTML=`<h2>EL SECRETO DE GIULIANA</h2><div class="card"><small>Tu nombre</small><input id="nm" maxlength="20" placeholder="Escribí tu nombre" value="${S&&S.name||''}"></div><h3>Elegí tu casa</h3>${HOUSES.map(h=>`<div class="card hz" style="border-color:${h.c};box-shadow:0 0 18px ${h.c}55"><span class="sh">${h.s}</span><div style="flex:1"><b style="color:${h.c}">${h.n}</b><br><small>${h.m}</small></div><button class="sm" style="background:${h.c}" onclick="pick('${h.k}')">ELEGIR</button></div>`).join('')}<p class="msg er" id="er"></p>`}
function pick(k){const n=$('#nm').value.trim();if(!n){$('#er').textContent='Primero escribí tu nombre.';return}
const id=S&&S.id||'p'+Math.random().toString(36).slice(2,10);
S={id,name:n,house:k,pts:100,done:{},hints:{},codes:{},final:false};applyHouse();sv();boom([H(k).s,'✨']);
$('#app').innerHTML=`<div class="big pop">${H(k).s}</div><h2>¡Tu lealtad ha sido elegida!</h2><p class="msg">+100 puntos para ${H(k).n}</p>`;setTimeout(()=>go('map'),2200)}
function map(a){const n=roomsDone();
a.innerHTML=`<div class="card"><b>${S.name}</b> · ${H(S.house).s} ${H(S.house).n}<br><small>${n}/6 SALAS COMPLETADAS</small><div class="bar"><b style="width:${n/6*100}%"></b></div></div>`+R.map((r,i)=>{const d=rdone(i);return`<div class="card" onclick="go('room',${i})"><div class="hz"><span class="sh">${r.e}</span><div style="flex:1"><b>${i+1}. ${r.n}</b><br><small>${r.d}</small></div><span>${d==4?'✅':d+'/4'}</span></div></div>`}).join('')+`<div class="card ${allRooms()?'':'locked'}" ${allRooms()?'onclick="go(\'final\')"':''}><div class="hz"><span class="sh">${allRooms()?'🚪':'🔒'}</span><div><b>LA BÓVEDA DE LOS 15</b><br><small>${allRooms()?'¡Abierta!':'Completá las seis salas'}</small></div></div></div>`}
function roomV(a){const r=R[room],d=rdone(room);
const pend=r.ch.map((c,i)=>({c,i})).filter(x=>!S.done[key(room,x.i)]);
a.innerHTML=`<button class="sm" onclick="go('map')">← Mapa</button><h2>${r.e} ${r.n}</h2><p class="msg mut">${r.d}</p><small>${d}/4 DESAFÍOS COMPLETADOS</small><div class="bar"><b style="width:${d*25}%"></b></div><div style="margin-top:8px">${r.ch.filter((_,i)=>S.done[key(room,i)]).map(c=>`<small class="ok">✅ ${c.t}</small><br>`).join('')}</div>`+
(pend.length?pend.map(x=>chal(x.c,x.i)).join(''):`<div class="card pop"><h3>SALA COMPLETA</h3><div class="big">${S.codes[room]||CFG.codes[room]}</div><p class="msg">Fragmento secreto desbloqueado — guardado en TU COLECCIÓN SECRETA.</p></div>`)+`<p class="msg" id="msg">${msg}</p>`}
function chal(c,i){const k=key(room,i),used=S.hints[k];let v=c.v==='GRID'?`<div class="sym">${gridHtml(c)}</div>`:c.v?`<div class="sym">${c.v}</div>`:'';
return`<div class="card" id="c${i}"><small>DESAFÍO ${room*4+i+1}/24 · ${c.p} pts</small><h3>${c.t}</h3><p>${c.q}</p>${v}`+
(c.o?c.o.map(o=>`<button onclick="check(${i},'${o}')">${o}</button>`).join(''):`<input id="in${i}" placeholder="Tu respuesta" autocomplete="off"><button class="gold" onclick="check(${i},$('#in${i}').value)">COMPROBAR</button>`)+
`<div id="h${i}">${used?`<p class="mut">💡 ${c.h}</p>`:`<button onclick="clue(${i})">¿NECESITÁS UNA PISTA?</button>`}</div><p class="msg" id="m${i}"></p></div>`}
function gridHtml(c){const s=[];for(let i=0;i<24;i++)s.push((c.g||[3,9,14,20]).includes(i)?'🦉':'🦇');return s.map((x,i)=>x+(i%6==5?'<br>':'')).join('')}
function clue(i){$('#h'+i).innerHTML=`<p>Usar esta pista le costará 50 puntos a tu casa. ¿Seguro?</p><div class="row"><button class="gold" onclick="useClue(${i})">USAR PISTA</button><button onclick="roomV($('#app'))">CANCELAR</button></div>`}
function useClue(i){const k=key(room,i);if(!S.hints[k]){S.hints[k]=1;S.pts-=50;sv();snd(300)}roomV($('#app'))}
function check(i,v){const c=R[room].ch[i],k=key(room,i);if(S.done[k])return;
if(c.a.map(norm).includes(norm(v))){S.done[k]=1;S.pts+=c.p;snd(780);boom(['✨']);
if(rdone(room)==4){S.codes[room]=CFG.codes[room]}sv();const el=$('#c'+i);
el.innerHTML='<h3>¡DESAFÍO COMPLETADO!</h3><p class="msg ok">+'+c.p+' puntos para '+H(S.house).n+'</p>';el.classList.add('dis');
setTimeout(()=>{msg=rdone(room)==4?'🔓 ¡Sala completa! Fragmento: '+CFG.codes[room]:'';roomV($('#app'));if(rdone(room)==4)boom(['🔑','✨'])},950)}
else{snd(180,.3);$('#m'+i).innerHTML='<span class="er">Todavía no. ¡Intentá de nuevo!</span>'}}
function final(a){if(!allRooms())return go('map');
if(S.final){a.innerHTML=`<div class="pop"><div class="door"><i></i></div><h1>¡FELICITACIONES! ¡DESBLOQUEASTE EL SECRETO DE LOS 15 DE GIULIANA!</h1><h2>¡Feliz cumpleaños 15, Giuliana! 🎂</h2><p class="msg">${S.name} · ${H(S.house).s} ${H(S.house).n}</p></div>`;return}
a.innerHTML=`<h2>LA BÓVEDA DE LOS 15</h2><p class="msg">ENCONTRASTE LOS SEIS SECRETOS…<br>EL MISTERIO FINAL TE ESPERA.</p><div class="card"><input id="f1" placeholder="Nombre de la cumpleañera"><input id="f2" inputmode="numeric" placeholder="Edad"><input id="f3" placeholder="Código secreto completo"><button class="gold" onclick="tryFinal()">ABRIR LA BÓVEDA</button><p class="msg er" id="fm"></p></div>`}
function tryFinal(){const ok=norm($('#f1').value)=='giuliana'&&['15','quince'].includes(norm($('#f2').value))&&norm($('#f3').value)==norm(CFG.codes.join(''));
if(!ok){snd(180,.4);$('#fm').textContent='La bóveda sigue cerrada. ¡Revisá tus pistas!';return}
S.final=true;S.pts+=+CFG.bonus||0;sv();boom(['🎉','🎂','✨','🎊','💛']);setTimeout(()=>boom(),1500);final($('#app'))}
function board(a){if(CFG.hideRank&&!isOwner){a.innerHTML='<h2>RANKING DE CASAS</h2><p class="msg">El ranking está oculto por ahora… 👀</p>';return}
const t=totals(),L=HOUSES.slice().sort((x,y)=>t[y.k]-t[x.k]);
a.innerHTML='<h2>RANKING DE CASAS</h2>'+L.map((h,i)=>`<div class="card hz" style="border-color:${h.c}"><b>#${i+1}</b><span class="sh">${h.s}</span><b style="flex:1;color:${h.c}">${h.n}</b><b>${t[h.k]}</b></div>`).join('')+(DB?'<p class="msg mut">🔴 En vivo</p>':'<p class="msg mut">Modo sin conexión: solo se cuentan tus puntos.</p>')}
function profile(a){const pend=24-Object.keys(S.done).length;
a.innerHTML=`<h2>${S.name}</h2><div class="card"><b>${H(S.house).s} ${H(S.house).n}</b><br>Puntos aportados: <b>${S.pts}</b><br>Salas completadas: ${roomsDone()}/6<br>Desafíos pendientes: ${pend}</div><h3>TU COLECCIÓN SECRETA</h3><div class="row" style="flex-wrap:wrap">${R.map((r,i)=>`<div class="card sym" style="flex:1 0 28%;padding:10px;font-size:22px;letter-spacing:0">${rdone(i)==4?CFG.codes[i]:'🔒'}</div>`).join('')}</div>`}
(()=>{const c=$('#bg'),x=c.getContext('2d');let P=[];function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);for(let i=0;i<70;i++)P.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+.4,v:Math.random()*.5+.15,g:Math.random()<.35});(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=c.height;p.x=Math.random()*c.width}x.globalAlpha=.4+.4*Math.sin(Date.now()/500+p.x);x.fillStyle=p.g?'#e8c46a':'#b9a7ff';x.shadowBlur=8;x.shadowColor=x.fillStyle;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
(async()=>{draw();try{const u=await claude.use('user');isOwner=!!(u&&await u.isOwner());DB=await claude.use('db')}catch(e){}
if(DB){
DB.collection('players').onSnapshot(q=>{players={};q.docs.forEach(d=>players[d.id]=d.data());
if(S&&players[S.id]&&!isOwner&&view=='board'||view=='admin')draw()},()=>{});
if(S&&S.name)sv()}else nav()})();
</script></body></html>
